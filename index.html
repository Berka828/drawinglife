<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BxCM | The Living Forest</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif;}
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #video-feed { display: none; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; z-index: 10; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);}
        #instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; z-index: 10; font-size: 20px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center;}
    </style>

    <!-- Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- MediaPipe POSE - Updated Stable CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="video-feed" autoplay playsinline muted crossorigin="anonymous"></video>
    <canvas id="webgl-canvas"></canvas>
    
    <div id="ui">Initializing Forest Engine...</div>
    <div id="instructions">Stand Tall for SUN ☀️ | Squat Down for RAIN 🌧️ | Dash for WIND 🌬️</div>

    <script src="app.js"></script>
</body>
</html>
