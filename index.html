<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BxCM | Magical Particle Wall</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif;}
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        /* Hide the video completely so only the magic is projected */
        #video-feed { display: none; }
        #status-ui { position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.5); z-index: 10; pointer-events: none;}
    </style>

    <!-- Import Map for Modern Three.js & Post-Processing -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/"
            }
        }
    </script>

    <!-- MediaPipe Core Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="video-feed" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="webgl-canvas"></canvas>
    
    <div id="status-ui">Initializing Engine & AI Tracker...</div>

    <!-- Main Application -->
    <script type="module" src="app.js"></script>

</body>
</html>
