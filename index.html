<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>BxCM Interactive Drawing</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #webgl-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #video-feed { position: absolute; top: 10px; right: 10px; width: 320px; z-index: 2; border: 2px solid white; border-radius: 8px;}
        #ui-layer { position: absolute; bottom: 20px; left: 20px; z-index: 3; color: white; font-family: sans-serif; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff6b6b; border: none; border-radius: 5px; color: white; font-weight: bold;}
    </style>
    <!-- Import Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://docs.opencv.org/4.5.2/opencv.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Three.js Canvas -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- Webcam Feed for Scanning & Tracking -->
    <video id="video-feed" autoplay playsinline></video>

    <!-- UI -->
    <div id="ui-layer">
        <button id="scan-btn">📸 Scan Drawing</button>
    </div>

    <!-- Application Scripts -->
    <script src="scanner.js"></script>
    <script src="app.js"></script>
</body>
</html>
